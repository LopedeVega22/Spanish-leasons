<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Práctica de verbos: presente y pasados</title>
<style>
:root{color-scheme:light;--bg:#f6f3ec;--card:#fff;--tx:#1e2a3a;--mut:#6b7686;--ln:#e4dfd3;--ok:#1f7a45;--no:#b03a2e;
--t0:#1f7a6d;--t0b:#eaf5f2;--t1:#4b50b8;--t1b:#eef0fb;--t2:#b7791f;--t2b:#fcf4e4;--t3:#9b3d78;--t3b:#f8ecf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.hero{background:#1e2a3a;color:#fff;border-radius:16px;padding:24px 22px}
h1{margin:0 0 6px;font-size:clamp(26px,6vw,38px);line-height:1.1}
.hero p{margin:0;color:#c3cddb;font-size:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:12px 0 8px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.tabs button.on{background:#1e2a3a;color:#fff;border-color:#1e2a3a}
.sc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:system-ui,sans-serif;font-size:14px;color:var(--mut)}
.sc b{color:var(--tx)}
.pg{height:6px;background:var(--ln);border-radius:3px;margin-top:6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--t0);transition:width .3s}
.q{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--mut);border-radius:12px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 3px rgba(30,42,58,.06)}
.q.t0{border-left-color:var(--t0)}.q.t1{border-left-color:var(--t1)}.q.t2{border-left-color:var(--t2)}.q.t3{border-left-color:var(--t3)}
.chip{font-family:system-ui,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:6px}
.t0 .chip b{color:var(--t0)}.t1 .chip b{color:var(--t1)}.t2 .chip b{color:var(--t2)}.t3 .chip b{color:var(--t3)}
.s{font-size:19px;line-height:1.7}
input{font:inherit;font-size:18px;width:9em;max-width:60vw;border:0;border-bottom:2px solid var(--mut);background:var(--bg);padding:2px 6px;color:var(--tx);outline:none}
input:focus{border-bottom-color:#1e2a3a;background:#fff}
input.ok{border-bottom-color:var(--ok);color:var(--ok);font-weight:bold}
input.no{border-bottom-color:var(--no);color:var(--no);text-decoration:line-through}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
button{font:inherit;font-family:system-ui,sans-serif;font-size:14px;background:#1e2a3a;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
.b{color:#fff}.b.t1{background:var(--t1)}.b.t2{background:var(--t2)}.b.t3{background:var(--t3)}
.b.good{opacity:1;outline:3px solid var(--ok)}.b.bad{opacity:1;outline:3px solid var(--no)}
.fb{font-family:system-ui,sans-serif;font-size:14px}
.fb.g{color:var(--ok)}.fb.r{color:var(--no)}
.fin{margin-top:16px;background:var(--card);border:2px solid var(--t0);border-radius:12px;padding:16px;text-align:center;font-size:18px;display:none}
.rs{background:transparent;color:var(--mut);border:1px solid var(--ln)}
.tb{display:block;flex:none;background:#1e2a3a;color:#fff;text-decoration:none;font:600 14px system-ui,sans-serif;padding:12px 16px}
.tb:hover,.tb:focus-visible{background:#2c3b50;outline:none}
</style>
</head>
<body>
<a class="tb" href="index.html">📚 ← Contenido clases de español</a>
<div class="wrap">
<div class="hero"><h1>Práctica de verbos</h1><p>Presente, perfecto simple, imperfecto y perfecto compuesto.</p></div>
<div class="bar">
<div class="tabs"><button id="m0" class="on">Completa la frase</button><button id="m1">¿Qué pasado es?</button></div>
<div class="sc"><span id="st"></span><button class="rs" id="rs">Reiniciar</button></div>
<div class="pg"><i id="pb"></i></div>
</div>
<div id="a0"></div><div id="a1" style="display:none"></div>
<div class="fin" id="fin"></div>
</div>
<script>
var T=["Presente","Perfecto simple","Imperfecto","Perfecto compuesto"];
var X=[
["Mi tía ___ clases en la universidad.","dar","ella",0,"da"],
["Siempre ___ la puerta de casa con llave.","cerrar","yo",0,"cierro"],
["No ___ esta palabra.","entender","yo",0,"entiendo"],
["Los viernes ___ a las cuatro de trabajar.","salir","yo",0,"salgo"],
["Ayer ___ tarde a clase.","llegar","yo",1,"llegué"],
["El año pasado ___ a Perú.","viajar","nosotros",1,"viajamos"],
["Anoche ___ una pizza para cenar.","pedir","ellos",1,"pidieron"],
["Ayer ___ la mesa.","poner","vosotros",1,"pusisteis"],
["Ella ___ que no podía venir.","decir","ella",1,"dijo"],
["El sábado pasado ___ al cine.","ir","nosotros",1,"fuimos"],
["Ayer ___ un accidente en la calle.","haber","impersonal",1,"hubo"],
["Cuando era niño, ___ al parque cada tarde.","ir","yo",2,"iba"],
["Mi abuelo ___ una hora todos los días.","caminar","él",2,"caminaba"],
["Antes ___ mucho café.","beber","tú",2,"bebías"],
["De niño, ___ muy tímido.","ser","yo",2,"era"],
["Hoy ___ mucho.","trabajar","yo",3,"he trabajado"],
["¿Qué ___ hoy?","comer","tú",3,"has comido"],
["Todavía no ___ la cena.","cocinar","nosotros",3,"hemos cocinado"],
["Los vecinos ya ___ de vacaciones.","volver","ellos",3,"han vuelto"],
["¿Ya ___ la película?","ver","vosotros",3,"habéis visto"]];
var Y=[
["Ayer llegué tarde.",1,"Acción terminada en un momento concreto (ayer)."],
["Cuando era niño, jugaba mucho.",2,"Costumbre en el pasado."],
["Hoy he comido paella.",3,"Pasado conectado con el presente (hoy)."],
["El año pasado viajé a Perú.",1,"Acción terminada, con fecha concreta."],
["Mi abuelo caminaba cada día.",2,"Hábito repetido en el pasado."],
["Todavía no he visto esa película.",3,"\"Todavía no\" conecta con el presente."],
["Anoche cenamos pronto.",1,"Acción terminada (anoche)."],
["Siempre escribía poemas.",2,"\"Siempre\" indica costumbre."],
["Esta semana hemos trabajado mucho.",3,"Periodo de tiempo que aún no ha terminado."],
["De repente sonó el teléfono.",1,"Suceso puntual y terminado."],
["Hacía frío y llovía.",2,"Descripción de una situación en el pasado."],
["¿Ya has hecho la tarea?",3,"\"Ya\" pregunta por algo relacionado con el presente."]];
var mode=0,res=[{},{}];
function $(i){return document.getElementById(i)}
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ")}
function strip(s){return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function build(m){var h="";
if(m==0)X.forEach(function(q,i){h+='<div class="q t'+q[3]+'"><div class="chip">'+q[1]+' · '+q[2]+' · <b>'+T[q[3]]+'</b></div><div class="s">'+q[0].replace("___",'<input id="i'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==\'Enter\')chk('+i+')">')+'</div><div class="row"><button onclick="chk('+i+')">Comprobar</button><span class="fb" id="f'+i+'"></span></div></div>'});
else Y.forEach(function(q,i){h+='<div class="q"><div class="s">'+q[0]+'</div><div class="row">'+[1,2,3].map(function(t){return '<button class="b t'+t+'" onclick="pick('+i+','+t+')">'+T[t]+'</button>'}).join("")+'</div><div class="fb" id="g'+i+'" style="margin-top:8px"></div></div>'});
$("a"+m).innerHTML=h}
function chk(i){if(res[0][i]!=null)return;var inp=$("i"+i),v=inp.value;if(!norm(v))return;
var a=X[i][4],ok=norm(v)==norm(a),near=!ok&&strip(v)==strip(a),f=$("f"+i);
res[0][i]=(ok||near)?1:0;inp.disabled=true;inp.className=res[0][i]?"ok":"no";
f.innerHTML=ok?"✓ Correcto":near?"✓ Casi: con tilde es <b>"+a+"</b>":"✗ Respuesta: <b>"+a+"</b>";
f.className="fb "+(res[0][i]?"g":"r");upd()}
function pick(i,t){if(res[1][i]!=null)return;var q=Y[i],ok=t==q[1];res[1][i]=ok?1:0;
var bs=$("a1").children[i].querySelectorAll(".b");
for(var k=0;k<3;k++){bs[k].disabled=true;if(k+1==q[1])bs[k].classList.add("good");else if(k+1==t)bs[k].classList.add("bad")}
var g=$("g"+i);g.className="fb "+(ok?"g":"r");g.textContent=(ok?"✓ ":"✗ Es "+T[q[1]]+". ")+q[2];upd()}
function upd(){var d=[X,Y][mode].length,r=res[mode],a=Object.keys(r).length,ok=0;for(var k in r)ok+=r[k];
$("st").innerHTML="Aciertos: <b>"+ok+" / "+d+"</b> · Respondidas: "+a;
$("pb").style.width=(100*a/d)+"%";
var f=$("fin");if(a==d){f.style.display="block";f.textContent=ok==d?"¡Perfecto! "+ok+" de "+d+" 🎉":ok>=d*0.7?"¡Muy bien! "+ok+" de "+d+". Repasa los que fallaste.":"Has acertado "+ok+" de "+d+". Repasa las tablas y vuelve a intentarlo."}else f.style.display="none"}
function setMode(m){mode=m;$("a0").style.display=m?"none":"block";$("a1").style.display=m?"block":"none";$("m0").className=m?"":"on";$("m1").className=m?"on":"";upd()}
$("m0").onclick=function(){setMode(0)};$("m1").onclick=function(){setMode(1)};
$("rs").onclick=function(){res[mode]={};build(mode);upd();window.scrollTo(0,0)};
build(0);build(1);upd();
</script>
</body>
</html>

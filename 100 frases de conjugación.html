<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 frases de conjugación</title>
<style>
:root{color-scheme:light;--bg:#f6f3ec;--card:#fff;--tx:#1e2a3a;--mut:#6b7686;--ln:#e4dfd3;--ok:#1f7a45;--no:#b03a2e;
--t0:#1f7a6d;--t1:#4b50b8;--t2:#b7791f;--t3:#9b3d78;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.hero{background:#1e2a3a;color:#fff;border-radius:16px;padding:20px 22px}
h1{margin:0 0 4px;font-size:clamp(24px,6vw,34px)}
.hero p{margin:0;color:#c3cddb;font-size:15px}
.top{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:14px;color:var(--mut);margin-top:16px}
.top b{color:var(--tx)}
.pg{height:6px;background:var(--ln);border-radius:3px;margin-top:6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#1e2a3a;transition:width .3s}
.card{background:var(--card);border:1px solid var(--ln);border-top:6px solid var(--mut);border-radius:14px;padding:22px 20px;margin-top:14px;box-shadow:0 2px 6px rgba(30,42,58,.08)}
.card.t0{border-top-color:var(--t0)}.card.t1{border-top-color:var(--t1)}.card.t2{border-top-color:var(--t2)}.card.t3{border-top-color:var(--t3)}
.chip{font-family:system-ui,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.t0 .chip{color:var(--t0)}.t1 .chip{color:var(--t1)}.t2 .chip{color:var(--t2)}.t3 .chip{color:var(--t3)}
.s{font-size:clamp(20px,5vw,25px);line-height:1.9;margin:12px 0 6px}
.hint{font-family:system-ui,sans-serif;font-size:14px;color:var(--mut)}
.hint b{color:var(--tx);font-size:16px}
input{font:inherit;font-size:21px;width:7.5em;max-width:60vw;text-align:center;border:0;border-bottom:3px solid var(--mut);border-radius:6px 6px 0 0;padding:2px 6px;background:var(--bg);color:var(--tx);outline:none}
input:focus{border-bottom-color:#1e2a3a;background:#fff}
input.ok{border-bottom-color:var(--ok);color:var(--ok);font-weight:bold}
input.no{border-bottom-color:var(--no);color:var(--no);text-decoration:line-through}
button{font:inherit;font-family:system-ui,sans-serif;font-size:15px;background:#1e2a3a;color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;margin-top:14px}
button.g{background:transparent;color:var(--mut);border:1px solid var(--ln)}
.fb{font-family:system-ui,sans-serif;font-size:16px;margin-top:12px;min-height:22px}
.fb.g{color:var(--ok)}.fb.r{color:var(--no)}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:14px;margin-top:10px;text-align:left}
td,th{padding:7px 4px;border-bottom:1px solid var(--ln)}
.big{font-size:44px;font-weight:bold;text-align:center}
.err{max-height:280px;overflow-y:auto;font-family:system-ui,sans-serif;font-size:14px;margin:10px 0}
.err div{padding:7px 0;border-bottom:1px solid var(--ln);line-height:1.5}
.nv{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nv button{margin-top:0;padding:9px 14px;font-size:14px}
.gp{display:none;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:10px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gb{margin:0!important;padding:8px 0!important;font-size:13px!important;background:#fff;color:var(--tx);border:1px solid var(--ln);border-bottom:4px solid var(--mut);border-radius:6px!important}
.gb.t0{border-bottom-color:var(--t0)}.gb.t1{border-bottom-color:var(--t1)}.gb.t2{border-bottom-color:var(--t2)}.gb.t3{border-bottom-color:var(--t3)}
.gb.ok{background:#dff1e6}.gb.no{background:#f8dedb}
.gb.cur{outline:2px solid #1e2a3a;font-weight:bold}
.lgd{font-family:system-ui,sans-serif;font-size:12px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>100 frases de conjugación</h1><p>Completa cada frase con la forma correcta del verbo.</p></div>
<div class="top"><span id="pn"></span><span id="sc"></span></div>
<div class="pg"><i id="pb"></i></div>
<div class="nv"><button class="g" id="bp" title="Anterior">←</button><button id="bg">Ir a la frase ▾</button><button class="g" id="bn" title="Siguiente">→</button><button class="g" id="br">Resultados</button></div>
<div class="gp" id="gp"></div>
<div class="card" id="card"></div>
</div>
<script>
var L="abrir aprender beber buscar caminar cerrar cocinar comenzar comer conocer creer dar decir encontrar entender escribir estar haber hablar hacer ir jugar leer llamar llegar mirar necesitar pagar pedir pensar poder poner preferir quedar querer saber salir sentarse sentir ser tener tomar trabajar traer usar venir ver viajar vivir volver".split(" ");
var EN="to open|to learn|to drink|to look for|to walk|to close|to cook|to begin|to eat|to know (a person or place)|to believe|to give|to say / to tell|to find|to understand|to write|to be (state / location)|to have (auxiliary) / there is|to speak|to do / to make|to go|to play|to read|to call|to arrive|to look at|to need|to pay|to ask for / to order|to think|can / to be able to|to put|to prefer|to stay / to meet up|to want / to love|to know (a fact) / to know how to|to go out / to leave|to sit down|to feel|to be (identity / trait)|to have|to take / to drink|to work|to bring|to use|to come|to see|to travel|to live|to return".split("|");
var A={abrir:{t:"abierto"},cerrar:{s:"ie"},comenzar:{s:"ie"},conocer:{y:"conozco"},
dar:{p:"doy,das,da,damos,dais,dan",d:"di,diste,dio,dimos,disteis,dieron"},
decir:{s:"i",y:"digo",u:"dij",t:"dicho"},encontrar:{s:"ue"},entender:{s:"ie"},escribir:{t:"escrito"},
estar:{p:"estoy,estás,está,estamos,estáis,están",u:"estuv"},haber:{p:"he,has,ha,hemos,habéis,han",u:"hub"},hacer:{y:"hago",u:"hic",t:"hecho"},
ir:{p:"voy,vas,va,vamos,vais,van",d:"fui,fuiste,fue,fuimos,fuisteis,fueron",m:"iba,ibas,iba,íbamos,ibais,iban"},
jugar:{s:"uu"},pedir:{s:"i"},pensar:{s:"ie"},poder:{s:"ue",u:"pud"},poner:{y:"pongo",u:"pus",t:"puesto"},
preferir:{s:"ie"},querer:{s:"ie",u:"quis"},saber:{y:"sé",u:"sup"},salir:{y:"salgo"},sentarse:{s:"ie"},sentir:{s:"ie"},
ser:{p:"soy,eres,es,somos,sois,son",d:"fui,fuiste,fue,fuimos,fuisteis,fueron",m:"era,eras,era,éramos,erais,eran"},
tener:{s:"ie",y:"tengo",u:"tuv"},traer:{y:"traigo",u:"traj"},venir:{s:"ie",y:"vengo",u:"vin"},
ver:{p:"veo,ves,ve,vemos,veis,ven",d:"vi,viste,vio,vimos,visteis,vieron",m:"veía,veías,veía,veíamos,veíais,veían",t:"visto"},
volver:{s:"ue",t:"vuelto"}};
function gen(inf,a,reg){
if(reg)a={};
var rf=/se$/.test(inf),b=rf?inf.slice(0,-2):inf,t=b.slice(-2),st=b.slice(0,-2),R=["me","te","se","nos","os","se"];
var E={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]}[t];
var P=[],D=[],M=[];
function sc(s){var k=a.s;
if(k=="ie")return s.replace(/e([^e]*)$/,"ie$1");
if(k=="ue")return s.replace(/o([^o]*)$/,"ue$1");
if(k=="uu")return s.replace(/u([^u]*)$/,"ue$1");
if(k=="i")return s.replace(/e([^e]*)$/,"i$1");return s}
if(a.p)P=a.p.split(",");else{for(var i=0;i<6;i++)P[i]=((i<3||i==5)?sc(st):st)+E[i];if(a.y)P[0]=a.y}
var v=/[aeo]$/.test(st);
if(a.d)D=a.d.split(",");
else if(a.u){var j=/j$/.test(a.u);D=["e","iste","o","imos","isteis",j?"eron":"ieron"].map(function(e){return a.u+e});if(inf=="hacer")D[2]="hizo"}
else if(t=="ar")D=["é","aste","ó","amos","asteis","aron"].map(function(e,i){var s=st;if(i==0&&!reg)s=s.replace(/c$/,"qu").replace(/g$/,"gu").replace(/z$/,"c");return s+e});
else D=["í","iste","ió","imos","isteis","ieron"].map(function(e,i){var s=st;
if(a.s&&t=="ir"&&(i==2||i==5)&&!reg)s=s.replace(/e([^e]*)$/,"i$1");
if(v&&!reg){if(i==2)return s+"yó";if(i==5)return s+"yeron";return s+e.replace("i","í")}
return s+e});
if(a.m)M=a.m.split(",");
else M=(t=="ar"?["aba","abas","aba","ábamos","abais","aban"]:["ía","ías","ía","íamos","íais","ían"]).map(function(e){return st+e});
var pt=a.t||(st+(t=="ar"?"ado":(v&&!reg?"ído":"ido")));
var C=["he","has","ha","hemos","habéis","han"].map(function(h){return h+" "+pt});
var out=[P,D,M,C];
if(rf)out=out.map(function(c){return c.map(function(f,i){return R[i]+" "+f})});
return out}

var D="abrir|1|3|Ayer nosotros ___ la tienda a las nueve.\nabrir|3|2|Mi madre ya ___ todas las ventanas.\naprender|0|0|Cada día ___ palabras nuevas en español.\naprender|2|1|Cuando eras niña, ___ muy rápido.\nbeber|3|1|¿Cuánta agua ___ hoy?\nbeber|1|5|Anoche ellos ___ demasiado café.\nbuscar|1|0|Ayer ___ mis llaves por toda la casa.\nbuscar|0|5|En mi empresa ___ gente que hable inglés.\ncaminar|2|2|Mi abuelo ___ una hora cada mañana.\ncaminar|0|3|Nosotros ___ al trabajo todos los días.\ncerrar|0|0|Siempre ___ la puerta de casa con llave.\ncerrar|1|4|Ayer vosotros ___ la tienda muy tarde.\ncocinar|3|1|¿Qué ___ para la cena?\ncocinar|2|0|De joven, ___ todos los domingos.\ncomenzar|0|2|Mañana ___ la nueva temporada de mi serie favorita.\ncomenzar|1|0|Ayer ___ un curso de inglés.\ncomer|3|5|Los niños ya ___ en el colegio.\ncomer|2|3|Los domingos ___ todos en casa de mi abuela.\nconocer|0|1|¿___ a Paula, la hermana de Tamara?\nconocer|1|0|El verano pasado ___ a mi mejor amiga.\ncreer|0|0|No ___ que llegue a tiempo al cine.\ncreer|1|2|Ayer ella ___ lo que le dijeron.\ndar|0|2|Mi tía ___ clases en la universidad.\ndar|1|5|Ayer los profesores nos ___ los exámenes.\ndecir|1|0|Ayer le ___ la verdad a mi hermano.\ndecir|3|1|¿Qué ___?\nencontrar|0|0|No ___ mis gafas de sol.\nencontrar|3|3|Por fin ___ un piso cerca del centro.\nentender|0|0|No ___ esta palabra.\nentender|2|4|Antes vosotros no ___ nada de alemán.\nescribir|2|0|Cuando era adolescente, ___ poemas.\nescribir|1|3|Anoche nosotros ___ una carta muy larga.\nestar|0|0|Hoy ___ muy cansado.\nestar|1|5|El domingo ellos ___ en la playa todo el día.\nhaber|1|2|Ayer ___ un accidente en la calle.\nhaber|2|2|Antes ___ un cine en este barrio.\nhablar|0|1|¿Cuántos idiomas ___?\nhablar|3|0|Hoy ___ con mi jefe por teléfono.\nhacer|1|1|Ayer tú ___ la compra.\nhacer|3|0|Esta tarde ___ un bizcocho de chocolate.\nir|1|3|El sábado pasado nosotros ___ al cine.\nir|2|0|De niño, ___ a la playa cada verano.\njugar|0|0|Los sábados ___ al tenis con mi primo.\njugar|1|0|Ayer ___ al fútbol con mis amigos.\nleer|0|0|Siempre ___ una hora antes de dormir.\nleer|1|2|Ayer él ___ el periódico entero.\nllamar|3|2|Carla ya ___ dos veces hoy.\nllamar|1|0|Anoche ___ a mi madre.\nllegar|0|2|Carlos siempre ___ tarde.\nllegar|1|0|Ayer ___ a casa a las diez.\nmirar|0|2|A veces mi gato ___ fijamente a la pared.\nmirar|2|5|De pequeños, los niños ___ la tele todas las tardes.\nnecesitar|0|0|___ cambiar de trabajo.\nnecesitar|1|3|El año pasado ___ ayuda con la mudanza.\npagar|3|2|¿Quién ___ la cuenta?\npagar|1|0|Ayer ___ el alquiler.\npedir|3|3|Ya ___ una pizza para cenar.\npedir|0|0|En los restaurantes siempre ___ agua.\npensar|0|1|¿Qué ___ sobre el reciclaje?\npensar|1|0|Anoche ___ mucho en ti.\npoder|0|1|¿___ ayudarme con los deberes?\npoder|1|5|Ayer ellos no ___ venir a la fiesta.\nponer|3|4|¿Aún no ___ la mesa?\nponer|1|0|Ayer ___ la mesa para ocho personas.\npreferir|0|1|¿___ playa o montaña?\npreferir|2|0|De niña, ___ el chocolate a la fruta.\nquedar|3|3|Ya ___ con Marta a las siete y media.\nquedar|1|0|Ayer ___ con mis primos para cenar.\nquerer|0|0|No ___ ver una película de miedo.\nquerer|1|2|Ayer él no ___ salir de casa.\nsaber|0|0|No ___ cómo te llamas.\nsaber|1|0|Ayer ___ la noticia por la radio.\nsalir|0|0|Los viernes ___ a las cuatro de trabajar.\nsalir|2|5|Antes ellos ___ de casa muy temprano.\nsentarse|0|0|En clase, siempre ___ junto a la ventana.\nsentarse|1|5|Ayer los niños ___ en el suelo.\nsentir|0|0|Lo ___ mucho.\nsentir|1|0|Cuando se fue, ___ mucha tristeza.\nser|0|0|___ arquitecto.\nser|2|0|De niño, ___ muy tímido.\ntener|0|0|___ dos hermanas y un hermano.\ntener|1|1|Ayer tú ___ mucha suerte.\ntomar|0|0|Por las mañanas siempre ___ un zumo de naranja.\ntomar|1|0|Ayer ___ el autobús al trabajo.\ntrabajar|0|0|___ en una fábrica de coches.\ntrabajar|2|0|Antes ___ en un banco.\ntraer|0|2|¿Nos ___ la cuenta, por favor?\ntraer|1|5|Ayer ellos ___ pasteles para todos.\nusar|0|1|¿Qué ordenador ___ para trabajar?\nusar|3|0|Hoy ___ el coche para ir al trabajo.\nvenir|0|1|¿___ esta noche al cine?\nvenir|1|5|El año pasado ellos ___ a visitarnos.\nver|3|0|Todavía no ___ esta película.\nver|1|1|Anoche tú ___ el partido.\nviajar|3|2|Mi primo Marcos ___ por toda Latinoamérica.\nviajar|1|0|El verano pasado ___ a Italia.\nvivir|0|0|___ en el centro.\nvivir|2|3|Cuando éramos niños, ___ en un pueblo.\nvolver|3|5|Los vecinos ya ___ de vacaciones.\nvolver|0|0|Siempre ___ a casa a pie.".split("\n");
var Q=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ellas / ustedes"];
var T=["Presente","Perfecto simple","Imperfecto","Perfecto compuesto"];
var cache={},qs,cur,ans;
function $(i){return document.getElementById(i)}
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ")}
function strip(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function form(k,t,p){var v=L[k];if(!cache[v])cache[v]=gen(v,A[v]||{},false);return cache[v][t][p]}
function make(){return D.map(function(l){var x=l.split("|"),k=L.indexOf(x[0]),t=+x[1],p=+x[2];return{v:k,t:t,p:p,s:x[3],a:form(k,t,p)}})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function start(list,shuf){qs=list||make();if(shuf)shuffle(qs);ans={};$("gp").style.display="none";go(0)}
function go(i){cur=Math.max(0,Math.min(qs.length-1,i));show();grid()}
function pickq(i){$("gp").style.display="none";go(i)}
function fbh(q,a){return a.ok==2?"✓ Correcto":a.ok==1?"✓ Casi: con tilde es <b>"+q.a+"</b>":"✗ Era <b>"+q.a+"</b>"}
function show(){
var q=qs[cur],a=ans[cur],c=$("card");
c.className="card t"+q.t;
c.innerHTML='<div class="chip">'+T[q.t]+'</div><div class="s">'+q.s.replace("___",'<input id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">')+'</div><div class="hint"><b>'+L[q.v]+'</b> ('+EN[q.v]+') · '+Q[q.p]+'</div><button id="go">'+(a?(cur==qs.length-1?"Ver resultados":"Siguiente →"):"Comprobar")+'</button><div class="fb" id="fb"></div>';
var inp=$("in");
if(a){inp.value=a.g;inp.disabled=true;inp.className=a.ok?"ok":"no";$("fb").className="fb "+(a.ok?"g":"r");$("fb").innerHTML=fbh(q,a)}
else{inp.onkeydown=function(e){if(e.key=="Enter")act()};inp.focus()}
$("go").onclick=act;upd()}
function upd(){var ok=0,n=0;for(var k in ans){n++;if(ans[k].ok)ok++}
$("pn").innerHTML="Frase <b>"+(cur+1)+" / "+qs.length+"</b>";
$("sc").innerHTML="Aciertos: <b>"+ok+"</b> · Hechas: "+n;
$("pb").style.width=(100*n/qs.length)+"%"}
function grid(){$("gp").innerHTML='<div class="gg">'+qs.map(function(q,i){return '<button class="gb t'+q.t+(i==cur?" cur":"")+(ans[i]?(ans[i].ok?" ok":" no"):"")+'" title="'+L[q.v]+'" onclick="pickq('+i+')">'+(i+1)+'</button>'}).join("")+'</div><div class="lgd">Franja inferior = tiempo · verde = acertada · roja = fallada · pasa el cursor para ver el verbo</div>'}
function act(){
if(ans[cur]){if(cur<qs.length-1)go(cur+1);else fin();return}
var q=qs[cur],val=$("in").value;if(!val.trim())return;
var refl=L[q.v]=="sentarse";
function c1(s){s=norm(s).replace(/^(yo|tú|él|ella|usted|nosotros|vosotros|ellos|ellas|ustedes) /,"");return refl?s.replace(/^(me|te|se|nos|os) /,""):s}
var ok=c1(val)==c1(q.a),near=!ok&&strip(c1(val))==strip(c1(q.a));
ans[cur]={g:val,ok:ok?2:near?1:0};
show();grid();$("go").focus()}
function fin(){
var ok=0,st=[[0,0],[0,0],[0,0],[0,0]],bad=[],n=0;
for(var i=0;i<qs.length;i++){var a=ans[i];if(!a)continue;n++;var q=qs[i];st[q.t][1]++;if(a.ok){ok++;st[q.t][0]++}else bad.push(i)}
var c=$("card");c.className="card";$("gp").style.display="none";
var rows=st.map(function(x,t){return x[1]?"<tr><td>"+T[t]+"</td><td><b>"+x[0]+" / "+x[1]+"</b></td></tr>":""}).join("");
var er=bad.map(function(i){var q=qs[i];return "<div><span style='color:var(--mut)'>"+(i+1)+".</span> "+q.s.replace("___","<b>"+q.a+"</b>")+"<br><span style='color:var(--mut)'>"+L[q.v]+" · "+T[q.t]+" · escribiste: </span><span style='color:var(--no)'>"+ans[i].g+"</span></div>"}).join("");
var next=-1;for(i=0;i<qs.length;i++)if(!ans[i]){next=i;break}
c.innerHTML='<div class="big">'+ok+' / '+n+'</div><p style="text-align:center;color:var(--mut)">'+(n<qs.length?"Has hecho "+n+" de "+qs.length+" frases.":ok==n?"¡Perfecto! 🎉":ok>=n*.8?"¡Muy bien!":ok>=n*.6?"Vas por buen camino.":"Repasa las tablas y vuelve a intentarlo.")+'</p><table>'+rows+'</table>'+(bad.length?'<div class="err">'+er+'</div>':'')
+(next>=0?'<button id="sg">Seguir con la frase '+(next+1)+'</button> ':'')
+(bad.length?'<button id="rv">Repasar los '+bad.length+' fallos</button> ':'')
+'<button class="g" id="rn">Empezar de nuevo</button>';
if(next>=0)$("sg").onclick=function(){go(next)};
if(bad.length)$("rv").onclick=function(){start(bad.map(function(i){return qs[i]}))};
$("rn").onclick=function(){start()};
$("pn").innerHTML="<b>Resultados</b>"}
$("bp").onclick=function(){go(cur-1)};
$("bn").onclick=function(){go(cur+1)};
$("bg").onclick=function(){var g=$("gp");g.style.display=g.style.display=="block"?"none":"block"};
$("br").onclick=fin;

start();
</script>
</body>
</html>
